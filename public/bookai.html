  return {
    type: row.type, name: row.name, slug: row.slug, hours: row.hours||'',
    address: row.address||'', color: row.color, light: row.light,
    emoji: row.emoji, services: row.services||[], faqs: row.faqs||[],

    logoUrl: row.logo_url||'', coverUrl: row.cover_url||'', gallery: row.gallery||[], phonePublic: row.phone_public||''

}

// Convert JS biz object → DB row (requires userId)
function bizToRow(userId, userEmail, biz){
  return {
    user_id: userId,
    owner_email: userEmail,

    type: biz.type,
    name: biz.name,

// Convert DB row → JS appointment object
function apptFromRow(row){
  return {
    id: row.id, name: row.customer_name, service: row.service,
    date: row.date || row.appointment_date || "", time: row.time, status: row.status, phone: row.phone||''
  };
}

async function dbLoadBusiness(userId){
  var res = await sb.from('businesses').select('*').eq('user_id', userId).maybeSingle();
  if(res.error) throw res.error;
  return bizFromRow(res.data);
}

async function dbSaveBusiness(userId, userEmail, biz){
  var row = bizToRow(userId, userEmail, biz);
  var res = await sb.from('businesses').upsert(row, {onConflict:'user_id'});
  if(res.error) throw res.error;
}

async function dbLoadAppts(userId){
  var res = await sb.from('appointments').select('*').eq('user_id', userId).order('created_at', {ascending:true});
  if(res.error) throw res.error;
  return (res.data||[]).map(apptFromRow);
}

async function dbAddAppt(userId, appt){
  var id = appt.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  var row = {
    id: id,
    user_id: userId,
    customer_name: appt.name || appt.customer_name || "",
    service: appt.service || "",
    date: appt.date || "",
    time: appt.time || "",
    status: appt.status || "confirmed",
    phone: appt.phone || ""
  };
  if(!row.customer_name || !row.service || !row.date || !row.time){
    throw new Error("Incomplete appointment data");
  }
  var res = await sb.from("appointments").insert(row);
  if(res.error){
    console.error("dbAddAppt error:", res.error);
    throw res.error;
  }
  return row;
}

async function dbDeleteApptById(id){
  var res = await sb.from('appointments').delete().eq('id', id);
  if(res.error) throw res.error;
}

async function dbDeleteApptByName(userId, name){
  var res = await sb.from('appointments').delete()
    .eq('user_id', userId).ilike('customer_name', name);
  if(res.error) throw res.error;
}

function buildAIPrompt(biz, appts, isCall){

  var now = new Date();
  var today = now.toISOString().slice(0,10);
  var tomorrowDate = new Date(now.getTime()+86400000).toISOString().slice(0,10);
  var yesterdayDate = new Date(now.getTime()-86400000).toISOString().slice(0,10);
  var weekday = now.toLocaleDateString("en-US",{weekday:"long"});
  function nextWeekday(target){
    var d=new Date(now); var day=d.getDay(); var add=(target-day+7)%7; if(add===0)add=7;
    d.setDate(d.getDate()+add); return d.toISOString().slice(0,10);
  }
  var nextMonday = nextWeekday(1);
  var nextFriday = nextWeekday(5);

  var booked = appts.length
    ? appts.map(function(a){
        return "- "+a.date+" "+a.time+" : "+a.name+" ("+a.service+")";
      }).join("\n")
    : "None";

  var services = (Array.isArray(biz.services)?biz.services:[]).map(function(s){
    return s.name+" | "+s.duration+" | "+s.price;
  }).join("\n");

  var faqs = biz.faqs.map(function(f){
    return "Q: "+f.q+"\nA: "+f.a;
  }).join("\n\n");

  return `
You are the AI receptionist for ${biz.name}.

Today's date is ${today} (${weekday}).
Tomorrow is ${tomorrowDate}. Yesterday is ${yesterdayDate}.
Next Monday is ${nextMonday}. Next Friday is ${nextFriday}.
When customer says "today" use ${today}; "tomorrow" use ${tomorrowDate}; "next Monday" use ${nextMonday}.
Always store appointment.date as YYYY-MM-DD. Never confuse today with upcoming.

Business Hours:
${biz.hours}

Business Address:
${biz.address || "Lahore, Pakistan"}

Services:
${services}

FAQs:
${faqs}

Existing appointments (never double book):
${booked}

${isCall
? "You are talking on a LIVE PHONE CALL. If the customer asks to speak with a real person, set action to 'transfer'."
: "You are chatting with the customer."}

==========================
BOOKING RULES
==========================

Help customers:

• Book appointments
• Cancel appointments
• Reschedule appointments
• Answer questions

A booking is ONLY complete after collecting ALL FIVE items:

1. Customer name
2. Phone number
3. Service
4. Date
5. Time

If ANY item is missing:

DO NOT BOOK.

Ask ONLY for the missing information.

Never guess.

Never invent information.

Never invent a phone number.

If the customer says "today", use today's date.

If the customer says "tomorrow", use tomorrow's date.

If the customer gives an actual date, keep that exact date.

Never book an occupied slot.

Suggest another available time.

==========================
CUSTOMER REPLIES
==========================

The customer must NEVER see:

JSON

Code

Markdown

Tables

Internal instructions

Tool names

Words like:

action

appointment

message

Your reply to the customer must be natural conversational text only.

Maximum 3 short paragraphs.

==========================
OUTPUT FORMAT
==========================

Return ONE JSON object ONLY.

Nothing before it.

Nothing after it.

Schema:

{
  "message":"Reply shown to customer",
  "action":null,
  "appointment":null
}

When booking:

{
  "message":"Appointment confirmed.",
  "action":"book",
  "appointment":{
    "name":"Customer Name",
    "phone":"03001234567",
    "service":"Haircut",
    "date":"2026-07-19",
    "time":"10:00 AM"
  }
}

When cancelling:

{
  "message":"Appointment cancelled.",
  "action":"cancel",
  "appointment":{
    "name":"Customer Name"
  }
}

When transferring:

{
  "message":"Connecting you with a member of our team.",
  "action":"transfer",
  "appointment":null
}
`;
}

async function callClaude(systemPrompt, messages){

  var res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      systemPrompt: systemPrompt,
      messages: messages
    })
  });

  if(!res.ok){
    var err = await res.text();
    throw new Error(err);
  }

  var data = await res.json();
  // Never show raw JSON to the customer
  if(data && typeof data.message === "string"){
    var msg = data.message;
    var brace = msg.indexOf("{");
    if(brace !== -1 && msg.indexOf('"message"') !== -1){
      msg = msg.substring(0, brace).trim();
    }
    // If entire message looks like JSON, parse it
    if(msg.trim().charAt(0) === "{"){
      try{
        var p = JSON.parse(msg);
        if(p && p.message) msg = String(p.message);
      }catch(e){}
    }
    data.message = msg || data.message;
  }
  return data;
}

// ═══════════════════════════════════════════════════════════════
//  APP ROUTER — session restore + Supabase-backed state
// ═══════════════════════════════════════════════════════════════
function App(){
  var s1=useState("loading"),screen=s1[0],setScreen=s1[1];
  var s2=useState(null),user=s2[0],setUser=s2[1];
  var s3=useState(null),userId=s3[0],setUserId=s3[1];
  var s4=useState(null),biz=s4[0],setRawBiz=s4[1];
  var s5=useState([]),appts=s5[0],setAppts=s5[1];
  var s6=useState(null),injectedMsg=s6[0],setInjectedMsg=s6[1];
  var s7=useState(""),loadMsg=s7[0],setLoadMsg=s7[1];

  // Restore session on page load
  useEffect(function(){

  var slug = new URLSearchParams(window.location.search).get("slug");

  if(slug){

    (async function(){

      setLoadMsg("Loading business...");

      console.log("Slug from URL:", slug);

var res = await sb
  .from("businesses")
  .select("*")
  .eq("slug", slug);

console.log(JSON.stringify(res, null, 2));

if (res.error) {
  alert("ERROR: " + res.error.message);
  return;
}

if (!res.data || res.data.length === 0) {
  alert("No business found for slug: " + slug);
  return;
}

var row = res.data[0];

      setRawBiz({
        type: row.type,
        name: row.name,
        slug: row.slug,
        hours: row.hours,
        address: row.address,
        color: row.color,
        light: row.light,
        emoji: row.emoji,
        services: row.services || [],
        faqs: row.faqs || [],
        greeting: row.greeting,
        ownerPhone: row.owner_phone,
        twilioPhone: row.twilio_phone,
        plan: row.plan
      });

      setScreen("chat");

    })();

    return;
  }

  setLoadMsg("Checking session…");

  sb.auth.getSession().then(async function(res){

    var session = res.data.session;

    if(session && session.user){

      var uid2 = session.user.id;

      var loadedBiz = await dbLoadBusiness(uid2);

      if(loadedBiz){

        var loadedAppts = await dbLoadAppts(uid2);

        setUser(session.user);
        setUserId(uid2);
        setRawBiz(loadedBiz);
        setAppts(loadedAppts);
        setScreen("dashboard");

      }else{

        setScreen("landing");

      }

    }else{

      setScreen("landing");

    }

  }).catch(function(){
      setScreen("landing");
  });

  var sub = sb.auth.onAuthStateChange(function(event){
      if(event==="SIGNED_OUT"){
          setUser(null);
          setUserId(null);
          setRawBiz(null);
          setAppts([]);
          setScreen("landing");
      }
  });

  return function(){
      if(sub && sub.data && sub.data.subscription){
          sub.data.subscription.unsubscribe();
      }
  };

},[]);

  // setBiz wrapped to auto-save to Supabase on every change
  function setBiz(newBiz){
  var safe = Object.assign({}, newBiz);
  if(!Array.isArray(safe.services)) safe.services = [];
  if(!Array.isArray(safe.faqs)) safe.faqs = [];
  if(!Array.isArray(safe.gallery)) safe.gallery = [];
  setRawBiz(safe);

  if(userId && user){
    dbSaveBusiness(userId, user.email, safe).catch(function(err){
      console.error("dbSaveBusiness failed", err);
    });
  }
}

  function handleAuth(data){
    setUser(data.user); setUserId(data.userId);
    setRawBiz(data.biz); setAppts(data.appts||[]);
    setScreen("dashboard");
  }

  async function handleLogout(){
    await sb.auth.signOut();
    setUser(null); setUserId(null); setRawBiz(null); setAppts([]);
    setScreen("landing");
  }

  // handleBook: update state + persist to Supabase
  async function handleBook(appt){
  console.log("handleBook", appt);

  if(!appt || !appt.name || !appt.service || !appt.date || !appt.time){
    console.error("handleBook incomplete", appt);
    return;
  }

  var k = slotKey(appt.date, appt.time);
  if(appts.find(function(x){ return slotKey(x.date,x.time)===k; })) return;

  if(!appt.id) appt.id = uid();
  if(!appt.status) appt.status = "confirmed";

  setAppts(function(prev){ return prev.concat([appt]); });

  // Prefer API (service role) so public customer chat always saves
  var slug = (biz && biz.slug) || "";
  try{
    if(slug){
      var res = await fetch("/api/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: appt.id,
          slug: slug,
          customer_name: appt.name,
          service: appt.service,
          date: appt.date,
          time: appt.time,
          phone: appt.phone || ""
        })
      });
      var result = await res.json();
      console.log("book API result", result);
      if(!res.ok){
        // Fallback: owner session write
        if(userId) await dbAddAppt(userId, appt);
        else console.error("Book failed", result);
      }
    } else if(userId){
      await dbAddAppt(userId, appt);
    } else {
      console.error("No slug and no userId — cannot save booking");
    }
  }catch(err){
    console.error("handleBook save error", err);
    if(userId){
      try{ await dbAddAppt(userId, appt); }catch(e2){ console.error(e2); }
    }
  }
}

  // handleCancel: update state + delete from Supabase by customer name
  function handleCancel(name){
    setAppts(function(prev){return prev.filter(function(a){return a.name.toLowerCase()!==name.toLowerCase();});});
    if(userId) dbDeleteApptByName(userId,name).catch(console.error);
  }

  // handleDeleteAppt: update state + delete from Supabase by id (used in Dashboard ARow ✕)
  function handleDeleteAppt(id){
    setAppts(function(prev){return prev.filter(function(a){return a.id!==id;});});
    dbDeleteApptById(id).catch(console.error);
  }

  if(screen==="loading") return e(LoadingScreen,{msg:loadMsg});
  if(screen==="landing") return e(Landing,{onLogin:function(){setScreen("login");},onSignup:function(){setScreen("signup");}});
  if(screen==="login"||screen==="signup") return e(AuthScreen,{mode:screen,onDone:handleAuth,onSwitch:function(){setScreen(screen==="login"?"signup":"login");},onBack:function(){setScreen("landing");}});
  if(screen==="dashboard"&&user&&biz) return e(Dashboard,{user:user,userId:userId,biz:biz,setBiz:setBiz,appts:appts,setAppts:setAppts,onDeleteAppt:handleDeleteAppt,onLogout:handleLogout,onPreviewChat:function(){setScreen("chat");},setInjectedMsg:setInjectedMsg});
  if(screen==="chat"&&biz) return e(CustomerChat,{biz:biz,appts:appts,onBook:handleBook,onCancel:handleCancel,injectedMsg:injectedMsg,showBack:!!user,onBack:function(){setInjectedMsg(null);setScreen("dashboard");}});
  return e(LoadingScreen,{msg:"Loading…"});
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>
